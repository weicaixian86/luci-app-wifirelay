name: Rescan Translation

on:
  workflow_dispatch:
  push:
    paths:
      - 'po/**'

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check UTF-8 text files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' '*.js' '*.lua' '*.sh' '*.yml' '*.yaml' '*.po' || true)
          [ -z "$files" ] || printf '%s\n' "$files" | xargs -r -n1 file --mime
